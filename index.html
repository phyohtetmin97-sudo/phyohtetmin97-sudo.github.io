<!DOCTYPE html>
<html>
<head>
<style>
p.one {

  border-style: double;
  border-width: 5px 5px;
  border-color: red;
  background-color: skyblue/* 5px top and bottom, 20px on the sides */
}

p.two {
  border-style: solid;
  border-width: 3px 3px;
  border-radius: 5px;
  border-color: blue;
  background-color: yellow;
  /* 20px top and bottom, 5px on the sides */
}

p.three {
  border-style: dotted;
  border-width: 5px 5px;
  border-color: pruple;
  background-color: lightgreen; /* 25px top, 10px right, 4px bottom and 35px left */
}
</style>
</head>
<body>

<p class="one">陳和平</p>
<p class="two">PHYO HTET MIN</p>
